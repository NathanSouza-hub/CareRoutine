<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Registro de sinais vitais no CareRoutine." />
    <title>Sinais vitais | CareRoutine</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__content">
        <a class="brand" href="index.html">Care<span>Routine</span></a>
        <p class="current-date" id="current-date" aria-live="polite"></p>
      </div>
    </header>

    <main>
      <header class="page-header container">
        <a class="back-link" href="index.html">← Voltar ao início</a>
        <h1>Sinais vitais</h1>
        <p>Registre as medições do dia para manter o acompanhamento organizado.</p>
      </header>

      <section class="form-panel container" aria-labelledby="form-title">
        <h2 id="form-title">Novo registro</h2>

        <form id="vitals-form">
          <div class="form-grid">
            <div class="form-field">
              <label for="date">Data</label>
              <input id="date" name="date" type="date" required />
            </div>

            <div class="form-field">
              <label for="time">Horário</label>
              <input id="time" name="time" type="time" required />
            </div>

            <div class="form-field">
              <label for="shift">Período/turno</label>
              <select id="shift" name="shift" required>
                <option value="">Selecione</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
                <option value="Madrugada">Madrugada</option>
              </select>
            </div>

            <div class="form-field">
              <label for="blood-pressure">Pressão arterial</label>
              <input
                id="blood-pressure"
                name="bloodPressure"
                type="text"
                placeholder="Ex.: 120/80"
                pattern="[0-9]{2,3}/[0-9]{2,3}"
                required
              />
              <small>Informe no formato sistólica/diastólica.</small>
            </div>

            <div class="form-field">
              <label for="temperature">Temperatura (°C)</label>
              <input
                id="temperature"
                name="temperature"
                type="number"
                min="30"
                max="45"
                step="0.1"
                placeholder="Ex.: 36,5"
                required
              />
            </div>

            <div class="form-field">
              <label for="oxygen-saturation">Saturação (%)</label>
              <input
                id="oxygen-saturation"
                name="oxygenSaturation"
                type="number"
                min="1"
                max="100"
                placeholder="Ex.: 98"
                required
              />
            </div>

            <div class="form-field">
              <label for="heart-rate">Frequência cardíaca (bpm)</label>
              <input
                id="heart-rate"
                name="heartRate"
                type="number"
                min="1"
                max="300"
                placeholder="Ex.: 72"
                required
              />
            </div>

            <div class="form-field">
              <label for="blood-glucose">Glicemia (mg/dL)</label>
              <input
                id="blood-glucose"
                name="bloodGlucose"
                type="number"
                min="1"
                max="1000"
                placeholder="Opcional"
              />
            </div>

            <div class="form-field form-field--full">
              <label for="notes">Observações</label>
              <textarea
                id="notes"
                name="notes"
                maxlength="500"
                placeholder="Anotações importantes sobre o momento da medição"
              ></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button class="primary-button" type="submit">Registrar sinais vitais</button>
            <p class="form-message" id="form-message" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>CareRoutine — apoio para o cuidado cotidiano.</p>
      </div>
    </footer>

    <script src="js/vitals.js"></script>
  </body>
</html>
