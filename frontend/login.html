<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entrar no CareRoutine." />
    <title>Entrar | CareRoutine</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="brand" href="login.html">Care<span>Routine</span></a>
        <h1>Entrar</h1>
        <p class="auth-subtitle">Acesse sua conta de cuidador.</p>

        <form id="login-form">
          <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="form-field" style="margin-top: 16px">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" />
          </div>
          <div class="form-actions" style="margin-top: 24px">
            <button class="primary-button" id="submit-button" type="submit">Entrar</button>
            <p class="form-message" id="form-message" aria-live="polite"></p>
          </div>
        </form>

        <p class="auth-footer">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>

    <script src="js/auth-repository.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
